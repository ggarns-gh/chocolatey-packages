name: Build & Test Package

on: [push, workflow_call, workflow_dispatch]

jobs:
  build-test:
    name: Build & Test Package
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Choco Pack
        uses: crazy-max/ghaction-chocolatey@v4
        with:
          args: pack manual/databricks-cli/databricks-cli.nuspec

      - name: Choco Install
        uses: crazy-max/ghaction-chocolatey@v4
        with:
          args: install databricks-cli -s="./" -y

      - name: Check Package Version
        run: |
          . ./manual/databricks-cli/tools/config.ps1

          $expectedOutput = "Databricks CLI v$cliVersion"
          $actualOutput = databricks -v

          echo "Expected CLI Output: $expectedOutput"
          echo "Actual CLI Output: $actualOutput"

          If ($actualOutput -ne $expectedOutput) {exit 1}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          path: databricks-cli.*.nupkg
          if-no-files-found: error
